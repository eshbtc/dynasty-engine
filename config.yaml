# config.yaml (Sample)

ticker: MSTR
entry_iv_rank_threshold: 30
target_put_profit_percent: 34
max_time_holding_days: 120
loc_deployment_percent: 0.25
max_position_size_dollars: 500000
slack_webhook_url: YOUR_SLACK_WEBHOOK_URL
gcp_secret_project_id: your-gcp-project-id
