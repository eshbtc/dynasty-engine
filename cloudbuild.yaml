# cloudbuild.yaml (for optional GCP CI/CD)

steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/dynasty-engine', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/dynasty-engine']
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['run', 'deploy', 'dynasty-engine', '--image', 'gcr.io/$PROJECT_ID/dynasty-engine', '--region', 'us-central1', '--platform', 'managed', '--allow-unauthenticated']

