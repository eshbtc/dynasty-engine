[project]
name = "dynasty-engine"
version = "0.1.0"
description = "Algorithmic trading engine"
readme = "README.MD"
requires-python = ">=3.10"
authors = [
    { name = "Dynasty" }
]
dependencies = [
    "ib_insync>=0.9.83",
    "apscheduler>=3.10",
    "prometheus-client>=0.19",
    "openai>=1.0",
    "chromadb>=0.4",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "numpy>=1.26",
    "streamlit>=1.32",
    "aiosqlite>=0.19",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
    "black>=24.4",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "B",  # bugbear
    "I",  # isort
    "UP", # pyupgrade
    "TRY",# tryceratops
    "SIM",# flake8-simplify
    "ARG",# flake8-unused-arguments
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = false

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"
